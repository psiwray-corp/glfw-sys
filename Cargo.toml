[package]
name = "glfw-sys"
version = "1.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Raw FFI bindings for the system GLFW shared library."
authors = ["Luca Cavallari <development@psiwray.com>"]
license = "MIT AND Zlib"
readme = "README.md"
repository = "https://github.com/psiwray-corp/glfw-sys"
keywords = ["glfw", "opengl", "windowing", "ffi", "bindings"]
categories = ["graphics", "api-bindings", "external-ffi-bindings"]
exclude = [".cargo", ".gitattributes", ".gitignore", ".rustfmt.toml", "docs", "scripts"]
publish = ["forgejo"]
links = "glfw"
build = "build.rs"

[lib]
name = "glfw_sys"
path = "src/lib.rs"
